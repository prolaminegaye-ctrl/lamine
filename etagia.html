<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETAGIA — LMS Intelligent</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#18120D;--surface:#221A13;--surface2:#2C2118;--surface3:#38291D;
  --border:#4A3525;--border2:#6B4C32;
  --accent:#E8794A;--accent-dim:rgba(232,121,74,.15);--accent-h:#F08555;
  --gold:#D4A843;--gold-s:rgba(212,168,67,.12);
  --teal:#20D4A8;--teal-s:rgba(32,212,168,.1);
  --text:#F5E8D8;--text2:#C4A882;--text3:#8B6845;
  --ok:#22D3A0;--warn:#E6A817;--danger:#F06354;
  --f:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --d:'Syne',system-ui,sans-serif;
  --r:10px;--rl:16px;--sb:240px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;overflow-x:hidden}
a{text-decoration:none;color:inherit}
h1,h2,h3{font-family:var(--d)}
button{cursor:pointer;font-family:var(--f)}
input,select,textarea{font-family:var(--f)}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sb);height:100vh;position:fixed;top:0;left:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;z-index:100;
  padding:24px 0 32px;transition:transform .3s;
}
#sidebar.hidden{transform:translateX(-100%)}
.sb-logo{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sb-logo .wm{font-family:var(--d);font-weight:800;font-size:22px;letter-spacing:.05em;
  background:linear-gradient(135deg,#E8794A,#D4A843);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-logo .tg{font-size:10px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:10px 20px 4px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 20px;
  color:var(--text2);font-size:13px;transition:all .2s;
  border-left:2px solid transparent;cursor:pointer;
}
.nav-item:hover,.nav-item.active{color:var(--text);background:var(--accent-dim);border-left-color:var(--accent)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .2s}
.nav-item:hover .nav-dot,.nav-item.active .nav-dot{background:var(--accent)}
.sb-bottom{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:10px}
.sb-av{width:34px;height:34px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent);flex-shrink:0}
.sb-uname{font-size:13px;font-weight:600;color:var(--text)}
.sb-role{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.sb-logout{background:transparent;border:none;color:var(--text3);font-size:11px;margin-top:8px;padding:4px 0;transition:color .2s;width:100%;text-align:left}
.sb-logout:hover{color:var(--danger)}

/* ── MAIN ── */
#main{margin-left:var(--sb);min-height:100vh;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;background:rgba(24,18,13,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:0 32px;height:58px;
  display:flex;align-items:center;justify-content:space-between;z-index:50;
}
.tb-title{font-family:var(--d);font-size:16px;font-weight:700;color:var(--text)}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-search{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
  padding:6px 14px;color:var(--text);font-size:13px;outline:none;width:220px;
}
.tb-search:focus{border-color:var(--accent)}
.tb-search::placeholder{color:var(--text3)}
.hamburger{display:none;background:transparent;border:none;color:var(--text2);font-size:20px;padding:4px 8px}

#content{flex:1;padding:32px}

/* ── AUTH PAGES ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.auth-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
  padding:40px;width:100%;max-width:420px;
}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .wm{font-family:var(--d);font-weight:800;font-size:28px;
  background:linear-gradient(135deg,#E8794A,#D4A843);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-logo p{font-size:12px;color:var(--text3);margin-top:4px}
.auth-card h2{font-size:20px;font-weight:700;margin-bottom:6px}
.auth-card p.sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.form-input{
  width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);font-size:14px;outline:none;transition:border-color .2s;
}
.form-input:focus{border-color:var(--accent)}
.form-input.error{border-color:var(--danger)}
.form-err{font-size:11px;color:var(--danger);margin-top:4px;display:none}
.form-err.show{display:block}
.btn{padding:11px 22px;border-radius:var(--r);border:none;font-size:14px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-h);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--accent);color:var(--text)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-full{width:100%;justify-content:center}
.btn-danger{background:rgba(240,99,84,.12);color:var(--danger);border:1px solid rgba(240,99,84,.3)}.btn-danger:hover{background:rgba(240,99,84,.2)}
.auth-switch{text-align:center;margin-top:20px;font-size:13px;color:var(--text3)}
.auth-switch a{color:var(--accent);cursor:pointer}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:24px;transition:border-color .2s}
.card:hover{border-color:var(--border2)}

/* ── COURSE CARDS ── */
.courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:24px}
.course-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
  overflow:hidden;transition:all .25s;cursor:pointer;display:flex;flex-direction:column;
}
.course-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 16px 36px rgba(0,0,0,.4)}
.cc-thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
.cc-type{position:absolute;top:10px;left:10px;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:700;border:1px solid}
.type-h5p{background:rgba(32,212,168,.1);color:var(--teal);border-color:rgba(32,212,168,.3)}
.type-scorm{background:rgba(212,168,67,.1);color:var(--gold);border-color:rgba(212,168,67,.3)}
.type-video{background:rgba(232,121,74,.1);color:var(--accent);border-color:rgba(232,121,74,.3)}
.type-text{background:rgba(196,168,130,.1);color:var(--text2);border-color:rgba(196,168,130,.3)}
.type-mixed{background:rgba(139,92,246,.1);color:#a78bfa;border-color:rgba(139,92,246,.3)}
.cc-body{padding:18px;flex:1;display:flex;flex-direction:column;gap:8px}
.cc-cat{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.cc-title{font-family:var(--d);font-size:15px;font-weight:700;line-height:1.3}
.cc-meta{font-size:11px;color:var(--text3);display:flex;gap:8px;align-items:center}
.cc-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cc-price{font-family:var(--d);font-size:16px;font-weight:700;color:var(--accent)}
.cc-free{font-family:var(--d);font-size:14px;font-weight:700;color:var(--ok)}
.stars{color:var(--gold);font-size:11px;letter-spacing:1px}

/* ── STATS ROW ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px}
.stat-val{font-family:var(--d);font-size:28px;font-weight:700;color:var(--accent);letter-spacing:-1px}
.stat-lbl{font-size:12px;color:var(--text3);margin-top:4px}

/* ── PROGRESS ── */
.prog-bar{background:var(--surface3);border-radius:100px;height:6px;overflow:hidden;flex:1}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:100px;transition:width .6s ease}

/* ── SECTION HEADER ── */
.sec-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.sec-tag::before{content:'';width:14px;height:1px;background:var(--accent)}
.sec-title{font-family:var(--d);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.sec-sub{font-size:14px;color:var(--text2);margin-bottom:24px}

/* ── FILTERS ── */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.fb{padding:6px 16px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:500;transition:all .2s}
.fb.on,.fb:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* ── LESSON MODULE LIST ── */
.mod-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:12px}
.mod-header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .2s}
.mod-header:hover{background:var(--surface2)}
.mod-title{font-family:var(--d);font-size:14px;font-weight:600}
.mod-lessons{border-top:1px solid var(--border)}
.lesson-row{
  display:flex;align-items:center;gap:12px;padding:11px 20px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s;
}
.lesson-row:last-child{border-bottom:none}
.lesson-row:hover{background:var(--surface2)}
.lesson-icon{font-size:16px;width:24px;text-align:center;flex-shrink:0}
.lesson-title{flex:1;font-size:13px}
.lesson-dur{font-size:11px;color:var(--text3)}
.lesson-status{font-size:10px;font-weight:600;padding:2px 8px;border-radius:100px}
.ls-done{background:rgba(34,211,160,.1);color:var(--ok);border:1px solid rgba(34,211,160,.3)}
.ls-lock{background:var(--surface3);color:var(--text3);border:1px solid var(--border)}
.ls-avail{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(232,121,74,.3)}

/* ── PLAYER ── */
.player-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.player-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.player-body{padding:24px}
.player-iframe{width:100%;height:500px;border:none;border-radius:var(--r);background:#000}
.player-text{max-width:720px;line-height:1.8;color:var(--text2)}
.player-text h1,.player-text h2,.player-text h3{color:var(--text);font-family:var(--d);margin:20px 0 10px}
.player-text p{margin-bottom:14px}
.player-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}

/* ── AI TUTOR ── */
.chat-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);display:flex;flex-direction:column;height:calc(100vh - 160px)}
.chat-hdr{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.chat-av{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;font-family:var(--d)}
.chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ai-av{background:var(--accent-dim);border:1px solid rgba(232,121,74,.3);color:var(--accent)}
.user-av{background:var(--surface3);color:var(--text2)}
.bubble{padding:10px 14px;border-radius:14px;max-width:82%;font-size:13px;line-height:1.6}
.ai-bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.user-bubble{background:var(--accent-dim);border:1px solid rgba(232,121,74,.3);border-bottom-right-radius:4px;color:var(--text2)}
.chat-in{border-top:1px solid var(--border);padding:16px 20px;display:flex;gap:10px}
.chat-input{flex:1;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:13px;outline:none}
.chat-input:focus{border-color:var(--accent)}
.chat-send{width:38px;height:38px;border-radius:var(--r);background:var(--accent);border:none;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-send:hover{background:var(--accent-h)}
.ai-tag{font-size:10px;color:var(--text3);margin-top:4px;font-family:var(--mono)}

/* ── QUIZ ── */
.quiz-q{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rl);padding:24px;margin-bottom:14px}
.quiz-q .qnum{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:10px}
.quiz-q .qtext{font-size:15px;font-weight:600;margin-bottom:16px;line-height:1.5}
.opt{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:all .2s;font-size:13px;
}
.opt:hover{border-color:var(--accent);background:var(--accent-dim)}
.opt.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.opt.correct{border-color:var(--ok);background:rgba(34,211,160,.1);color:var(--ok)}
.opt.wrong{border-color:var(--danger);background:rgba(240,99,84,.08);color:var(--danger)}
.opt input{accent-color:var(--accent)}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{
  padding:12px 18px;border-radius:var(--r);font-size:13px;font-weight:500;min-width:260px;
  animation:toastIn .3s ease;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast-ok{background:rgba(34,211,160,.15);border:1px solid rgba(34,211,160,.3);color:var(--ok)}
.toast-err{background:rgba(240,99,84,.12);border:1px solid rgba(240,99,84,.3);color:var(--danger)}
.toast-info{background:var(--accent-dim);border:1px solid rgba(232,121,74,.3);color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;position:relative;transform:translateY(14px);transition:transform .25s}
.modal-bg.open .modal-box{transform:translateY(0)}
.modal-close{position:absolute;top:14px;right:16px;background:transparent;border:none;color:var(--text3);font-size:20px;line-height:1;transition:color .2s}
.modal-close:hover{color:var(--text)}

/* ── BADGE ── */
.badge{display:inline-block;padding:2px 9px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.05em}
.badge-learner{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(232,121,74,.3)}
.badge-teacher{background:var(--teal-s);color:var(--teal);border:1px solid rgba(32,212,168,.3)}
.badge-admin{background:var(--gold-s);color:var(--gold);border:1px solid rgba(212,168,67,.3)}
.badge-cert{background:var(--gold-s);color:var(--gold);border:1px solid rgba(212,168,67,.3)}
.badge-new{background:rgba(34,211,160,.1);color:var(--ok);border:1px solid rgba(34,211,160,.3)}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface2)}
.tbl td{padding:11px 14px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border)}
.tbl tr:hover td{background:var(--surface2)}

/* ── CALLOUT ── */
.callout{border-left:3px solid var(--accent);padding:14px 18px;background:var(--accent-dim);border-radius:0 var(--r) var(--r) 0;font-size:13px;color:var(--text2);margin:16px 0}
.callout.teal{border-left-color:var(--teal);background:var(--teal-s)}
.callout.gold{border-left-color:var(--gold);background:var(--gold-s)}

/* ── SPINNER ── */
.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--text3)}

/* ── SCORM BADGE ── */
.content-badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;
  font-size:11px;font-weight:600;border:1px solid;
}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty .big{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px;margin-bottom:20px}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  .hamburger{display:block}
  .stats-row{grid-template-columns:1fr 1fr}
  .tb-search{display:none}
}
@media(max-width:600px){
  .courses-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr}
  #content{padding:16px}
}
</style>
</head>
<body>

<div id="toast-wrap" class="toast-wrap"></div>

<!-- MODAL -->
<div id="modal" class="modal-bg">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- AUTH PAGES (shown when not logged in) -->
<div id="auth-page" style="display:none"></div>

<!-- APP (shown when logged in) -->
<div id="app" style="display:none">
  <nav id="sidebar">
    <div class="sb-logo">
      <div class="wm">ETAGIA</div>
      <div class="tg">LMS Intelligent · EdTech Africa</div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Principal</div>
      <div class="nav-item" data-route="/" onclick="nav(this)"><span class="nav-dot"></span>🏠 Dashboard</div>
      <div class="nav-item" data-route="/courses" onclick="nav(this)"><span class="nav-dot"></span>📚 Catalogue</div>
      <div class="nav-item" data-route="/progress" onclick="nav(this)"><span class="nav-dot"></span>📈 Ma progression</div>
      <div class="nav-item" data-route="/ai-tutor" onclick="nav(this)"><span class="nav-dot"></span>🤖 AI Tuteur</div>
    </div>

async function markDone(lessonId,courseId,nextLessonId){
  await sb.from('lesson_progress').upsert({user_id:_user.id,lesson_id:lessonId,course_id:courseId,status:'completed',completed_at:new Date().toISOString()});
  // Update enrollment progress
  const {data:allLessons}=await sb.from('lessons').select('id').eq('course_id',courseId);
  const {data:doneLessons}=await sb.from('lesson_progress').select('lesson_id').eq('user_id',_user.id).eq('course_id',courseId).eq('status','completed');
  const progress=(doneLessons?.length||1)/(allLessons?.length||1)*100;
  await sb.from('enrollments').upsert({user_id:_user.id,course_id:courseId,progress,last_accessed:new Date().toISOString()},{onConflict:'user_id,course_id'});
  // XP
  await sb.from('profiles').update({total_xp:(_profile?.total_xp||0)+10}).eq('id',_user.id);
  _profile={..._profile,total_xp:(_profile?.total_xp||0)+10};
  const btn=document.getElementById('complete-btn');
  if(btn){btn.innerHTML='✓ Complété';btn.style.background='var(--ok)';}
  toast('+10 XP · Leçon terminée ! 🎉','ok');
  if(nextLessonId) setTimeout(()=>route$(`/learn/${courseId}/${nextLessonId}`),1200);
}

function initSCORM(lessonId,courseId){
  const scormData={};
  let scormCompleted=false;
  // Inject SCORM API into window so iframe can access via parent
  window.API={
    LMSInitialize(s){return'true'},
    LMSFinish(s){if(scormCompleted)markDone(lessonId,courseId,'');return'true'},
    LMSGetValue(e){return scormData[e]||''},
    LMSSetValue(e,v){
      scormData[e]=v;
      if(e==='cmi.core.lesson_status'&&(v==='completed'||v==='passed')){
        scormCompleted=true;
        const btn=document.getElementById('complete-btn');
        if(btn){btn.click();}
      }
      return'true'
    },
    LMSCommit(s){return'true'},
    LMSGetLastError(){return'0'},
    LMSGetErrorString(e){return''},

// ── QUIZ ──
async function loadQuiz(container,lesson,courseId){
  // Find quiz linked to this lesson's course
  const {data:quiz}=await sb.from('quizzes').select('*').eq('course_id',courseId).limit(1).single();
  if(!quiz){container.innerHTML='<div class="callout">Quiz non trouvé pour ce cours.</div>';return}
  const {data:questions}=await sb.from('quiz_questions').select('*').eq('quiz_id',quiz.id).order('order_index');
  if(!questions||!questions.length){container.innerHTML='<div class="callout">Aucune question disponible.</div>';return}
  let answers={}, submitted=false;
  function renderQ(){
    container.innerHTML=`
      <div style="margin-bottom:20px">
        <h3 style="font-family:var(--d);font-size:17px">${quiz.title}</h3>
        <p style="font-size:13px;color:var(--text3)">Score de passage : ${quiz.passing_score}% · ${questions.length} questions</p>
      </div>
      ${questions.map((q,i)=>{
        const opts=typeof q.options==='string'?JSON.parse(q.options):q.options;
        return `<div class="quiz-q">
          <div class="qnum">Question ${i+1}/${questions.length}</div>
          <div class="qtext">${q.question_text}</div>
          ${(opts||[]).map(o=>`
            <div class="opt ${!submitted&&answers[q.id]===o.id?'selected':''} ${submitted?(o.is_correct?'correct':(answers[q.id]===o.id?'wrong':'')):''}">
              <input type="radio" name="q_${q.id}" value="${o.id}" ${answers[q.id]===o.id?'checked':''} ${submitted?'disabled':''} onchange="quizAnswer('${q.id}','${o.id}')">
              <span>${o.text}</span>
            </div>`).join('')}
          ${submitted&&q.explanation?`<div class="callout teal" style="margin-top:10px;font-size:12px">💡 ${q.explanation}</div>`:''}
        </div>`;
      }).join('')}
      ${!submitted?`<button class="btn btn-primary" onclick="submitQuiz('${quiz.id}','${courseId}')">Soumettre le quiz →</button>`:
      `<div id="quiz-result"></div>`}
    `;
  }
  window.quizAnswer=(qid,oid)=>{answers[qid]=oid;};
  window.submitQuiz=async(quizId,cid)=>{
    const unanswered=questions.filter(q=>!answers[q.id]);
    if(unanswered.length){toast(`Répondez à toutes les questions (${unanswered.length} restante${unanswered.length>1?'s':''})`, 'err');return}
    submitted=true;
    let correct=0;
    questions.forEach(q=>{if(answers[q.id]===q.correct_answer) correct++;});
    const score=(correct/questions.length)*100;
    const passed=score>=quiz.passing_score;
    await sb.from('quiz_attempts').insert({user_id:_user.id,quiz_id:quizId,answers:JSON.stringify(answers),score,passed});
    renderQ();
    document.getElementById('quiz-result').innerHTML=`
      <div class="card" style="text-align:center;margin-top:20px;border-color:${passed?'var(--ok)':'var(--danger)'}">
        <div style="font-size:48px;margin-bottom:12px">${passed?'🎉':'😔'}</div>
        <div style="font-family:var(--d);font-size:28px;font-weight:700;color:${passed?'var(--ok)':'var(--danger)'}">${Math.round(score)}%</div>
        <div style="font-size:16px;margin:8px 0">${passed?'Quiz réussi !':'Score insuffisant'}</div>
        <p style="color:var(--text2);font-size:13px">${correct}/${questions.length} réponses correctes · Seuil : ${quiz.passing_score}%</p>
        ${passed?`<button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="markDone('${lesson.id}','${cid}','')">✓ Valider la leçon</button>`:`<button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="location.reload()">Recommencer</button>`}
      </div>`;
  };
  renderQ();
}

async function sendMsg(){
  const input=document.getElementById('chat-input');
  const msg=input.value.trim();
  if(!msg) return;
  input.value='';
  const msgs=document.getElementById('chat-msgs');
  const initials=(_profile?.full_name||'U').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  // User bubble
  msgs.innerHTML+=`<div class="msg user"><div class="msg-av user-av">${initials}</div><div class="bubble user-bubble">${msg}</div></div>`;
  // Typing
  const typingId='typing-'+Date.now();
  msgs.innerHTML+=`<div class="msg" id="${typingId}"><div class="msg-av ai-av">E</div><div class="bubble ai-bubble" style="color:var(--text3)">⋯ en train d'écrire</div></div>`;
  msgs.scrollTop=msgs.scrollHeight;
  // Save to DB
  const msgLower=msg.toLowerCase();
  let respArr=AI_RESPONSES.default;
  if(msgLower.includes('scorm')) respArr=AI_RESPONSES.scorm;
  else if(msgLower.includes('h5p')) respArr=AI_RESPONSES.h5p;
  else if(msgLower.includes('cours')||msgLower.includes('formation')) respArr=AI_RESPONSES.cours;
  else if(msgLower.includes('ia')||msgLower.includes('intelligence')||msgLower.includes('chatgpt')||msgLower.includes('claude')) respArr=AI_RESPONSES.ia;
  else if(msgLower.includes('marketing')) respArr=AI_RESPONSES.marketing;
  const resp=respArr[Math.floor(Math.random()*respArr.length)];
  setTimeout(async()=>{
    document.getElementById(typingId)?.remove();
    // Format markdown-like
    const formatted=resp.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>').replace(/→/g,'<span style="color:var(--accent)">→</span>');
    msgs.innerHTML+=`<div class="msg"><div class="msg-av ai-av">E</div><div><div class="bubble ai-bubble">${formatted}</div><div class="ai-tag">IA · Généré par ETAGIA-Tutor-v1 · 🇪🇺 AI Act conforme</div></div></div>`;
    msgs.scrollTop=msgs.scrollHeight;
    await sb.from('ai_interactions').insert({user_id:_user.id,session_id:_chatSession,user_message:msg,ai_response:resp,model_used:'etagia-tutor-v1'});
  },1200);
}

async function createCourse(){
  const title=document.getElementById('nc-title').value.trim();
  if(!title){document.getElementById('nc-err').textContent='Le titre est requis';document.getElementById('nc-err').classList.add('show');return}
  const emojis=['📚','🎯','💡','🚀','🔬','📊','💼','🌍','⚡','🎓'];
  const {data,error}=await sb.from('courses').insert({
    title,
    description:document.getElementById('nc-desc').value,
    category:document.getElementById('nc-cat').value,
    content_type:document.getElementById('nc-type').value,
    level:document.getElementById('nc-level').value,
    price_fcfa:parseInt(document.getElementById('nc-price').value)||0,
    is_certified:document.getElementById('nc-cert').checked,
    thumbnail_emoji:emojis[Math.floor(Math.random()*emojis.length)],
    thumbnail_color:'#1C1410',
    author_id:_user.id,
    status:'published'
  }).select().single();
  if(error){document.getElementById('nc-err').textContent=error.message;document.getElementById('nc-err').classList.add('show');return}
  closeModal();
  toast('Cours créé avec succès ! 🎉','ok');
  route$('/teacher');
}

// ── INIT ──
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){
    _user=session.user;
    await loadProfile();
    await seedIfNeeded();
    showApp();
    if(!window.location.hash) window.location.hash='#/';
    renderRoute();
  } else {
    showAuth('login');
  }
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session?.user&&!_user){
      _user=session.user;
      await loadProfile();
      await seedIfNeeded();
      showApp();
    }
    if(event==='SIGNED_OUT'){_user=null;_profile=null;showAuth('login')}
  });
}
init();
