name: Fetch GolleO source from Vercel deployment

on:
  push:
    branches: [claude/relaxed-bohr-5csbuf]
    paths: ['.golleo-fetch-request']

env:
  DEPLOYMENT_ID: dpl_2omFemUPatcYxG9DveZPgHc9kijT
  TEAM_ID: team_pjZ6wWWlhkZm8cUYllxIehT9

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download deployment source files
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DPL: ${{ env.DEPLOYMENT_ID }}
          TEAM: ${{ env.TEAM_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(echo -n "$VERCEL_TOKEN" | tr -d '\t\n\r ')
          AUTH="Authorization: Bearer $TOKEN"
          OUT="golleo-smart-hire-src"
          rm -rf "$OUT" && mkdir -p "$OUT"

          echo "Listing files of $DPL ..."
          curl -sf -H "$AUTH" "https://api.vercel.com/v6/deployments/$DPL/files?teamId=$TEAM" > /tmp/tree.json
          echo "Tree downloaded ($(wc -c < /tmp/tree.json) bytes)"

          # Walk the tree recursively -> lines of "<uid>\t<path>"
          jq -r '
            def walk_tree(prefix):
              .[] |
              if .type == "directory" then
                (.children // []) | walk_tree(prefix + .name + "/")
              elif .type == "file" then
                "\(.uid)\t\(prefix + .name)"
              else
                empty
              end;
            walk_tree("")
          ' /tmp/tree.json > /tmp/files.tsv || {
            # fallback: tree may be a single root object
            jq -r '
              def walk2(prefix):
                if .type == "directory" then
                  (.children // [])[] | walk2(prefix + .name + "/")
                elif .type == "file" then
                  "\(.uid)\t\(prefix + .name)"
                else empty end;
              if type == "array" then .[] | walk2("") else walk2("") end
            ' /tmp/tree.json > /tmp/files.tsv
          }

          N=$(wc -l < /tmp/files.tsv)
          echo "Found $N files"
          head -20 /tmp/files.tsv | cut -f2

          while IFS=$'\t' read -r uid path; do
            # strip leading "src/" segment Vercel sometimes adds
            rel="${path#src/}"
            mkdir -p "$OUT/$(dirname "$rel")"
            body=$(curl -sf -H "$AUTH" "https://api.vercel.com/v7/deployments/$DPL/files/$uid?teamId=$TEAM" || true)
            if [ -z "$body" ]; then
              echo "WARN: empty response for $rel" && continue
            fi
            # v7 returns {"data": "<base64>"} ; handle raw fallback
            if echo "$body" | jq -e '.data' >/dev/null 2>&1; then
              echo "$body" | jq -r '.data' | base64 -d > "$OUT/$rel" 2>/dev/null || echo "$body" | jq -r '.data' > "$OUT/$rel"
            else
              printf '%s' "$body" > "$OUT/$rel"
            fi
          done < /tmp/files.tsv
          echo "Downloaded files:"
          find "$OUT" -type f | head -50
          find "$OUT" -type f | wc -l

      - name: Export project settings (no secret values)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM: ${{ env.TEAM_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(echo -n "$VERCEL_TOKEN" | tr -d '\t\n\r ')
          AUTH="Authorization: Bearer $TOKEN"
          curl -sf -H "$AUTH" "https://api.vercel.com/v9/projects/prj_iZja6BQ3UrMIeacqpmwiBDt7RhoO?teamId=$TEAM" \
            | jq '{name, framework, rootDirectory, installCommand, buildCommand, outputDirectory, devCommand, nodeVersion}' \
            > golleo-smart-hire-src/_vercel-project-settings.json
          curl -sf -H "$AUTH" "https://api.vercel.com/v9/projects/prj_iZja6BQ3UrMIeacqpmwiBDt7RhoO/env?teamId=$TEAM" \
            | jq '{envNames: [.envs[] | {key, target, type}]}' \
            > golleo-smart-hire-src/_vercel-env-names.json
          cat golleo-smart-hire-src/_vercel-project-settings.json
          cat golleo-smart-hire-src/_vercel-env-names.json

      - name: Commit source to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f golleo-smart-hire-src
          git commit -m "chore: import GolleO source from Vercel deployment archive" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
