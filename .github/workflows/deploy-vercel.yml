name: Deploy ETAGIA LMS to Vercel

on:
  push:
    branches: [claude/make-site-functional-7if3x]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        working-directory: etagia-lms
        run: npm ci

      - name: Deploy to Vercel
        id: deploy
        working-directory: etagia-lms
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TOKEN=$(echo -n "$VERCEL_TOKEN" | tr -d '\t\n\r ')
          echo "Token length: ${#TOKEN}"
          OUTPUT=$(vercel deploy --prod --yes \
            --token="$TOKEN" \
            --env NEXT_PUBLIC_SUPABASE_URL="https://taimtpltpaxugfcmwsux.supabase.co" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhaW10cGx0cGF4dWdmY213c3V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODg2NjQsImV4cCI6MjA5MzY2NDY2NH0.CxGX4CetHYhb-FqN6LWZlm0VS4PevUdc6p9IGPQe-Ow" \
            2>&1 | tee /tmp/out.txt)
          cat /tmp/out.txt
          URL=$(grep -o 'https://[^ ]*\.vercel\.app' /tmp/out.txt | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo ">>> DEPLOYED TO: $URL"
